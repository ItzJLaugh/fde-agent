[project]
name = "fde-agent"
version = "0.1.0"
description = "Forward Deployed Engineering project: Olist e-commerce revenue growth analysis."
readme = "README.md"
authors = [
    { name = "Jackson Laughlin", email = "121478107+ItzJLaugh@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
allowed-confusables = ["–", "×"]  # en dash and times sign are intentional in chart labels

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
